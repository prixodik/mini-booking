schema: spec-driven

context: |
  Проект: Mini Booking — тестовое задание на позицию Middle Fullstack Developer.
  Бронирование одной переговорной комнаты по часовым слотам. Лимит на реализацию: ~2 часа.
  На защите автор объясняет код и вносит небольшую правку за 10–15 минут без ИИ-помощников,
  поэтому код должен быть простым, читаемым и без лишних абстракций.

  Процесс: spec first. Сначала спецификация (change в openspec/changes/), проверка и
  согласование с владельцем (Alex), и только потом код. Код не пишется до одобрения change.

  Язык: артефакты OpenSpec, README, сообщения API и интерфейс — на русском.
  Структурные заголовки OpenSpec и ключевые слова SHALL/MUST — на английском.

  Стек (зафиксировано ТЗ): PHP 8.2+, Laravel 11+, Vue 3 / Nuxt 3 (Composition API, <script setup>),
  БД SQLite/MySQL/PostgreSQL. Выбрано: Laravel 12, Nuxt 3 (режим SPA, ssr: false), PrimeVue 4,
  SQLite, тесты на PHPUnit.

  Структура репозитория:
    backend/    — Laravel (JSON API, миграции, Seeder, тесты)
    frontend/   — Nuxt 3 + PrimeVue (pages/, layouts/, components/, composables/, services/; сейчас одна страница `/`)
    openspec/   — спецификации и changes
    README.md   — запуск, настройки, описание уникальности брони и времени

  Предметные правила из ТЗ:
  - Комната доступна каждый день 09:00–18:00, включая выходные; 9 часовых слотов (09–10 … 17–18).
  - У слота максимум одно активное бронирование; гарантия обеспечивается БД, а не только кодом.
  - Время расписания — по app.timezone Laravel; слот с началом <= now() считается прошедшим.
  - Seeder: 7 календарных дней включая сегодня; идемпотентный, существующие данные не трогает.
  - API: GET /api/slots, POST /api/bookings (201/409/422), DELETE /api/bookings/{id} (204).
  - Вне объёма: авторизация, управление комнатами, админка, Scheduler/cron для продления расписания.
  - Приоритет при нехватке времени: основной сценарий от запуска до создания и отмены брони.
  - Что не успели — честно указывать в README.

rules:
  proposal:
    - Явно указывать, что вне объёма (out of scope) и ссылаться на пункт ТЗ.
  specs:
    - Каждое требование содержит SHALL/MUST и хотя бы один Scenario с WHEN/THEN.
    - Поведение API описывать через HTTP-статусы и форму JSON, а не через реализацию.
  tasks:
    - Задачи мелкие (до ~20 минут), в порядке выполнения; тест-задачи ссылаются на сценарии спецификации.
